<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>(가상) 행정정보 통합관리 기본법 조항 카드 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --paper: #F3F6FA;
    --surface: #FFFFFF;
    --ink: #0F2438;
    --muted: #4F6277;
    --line: #D3DCE6;
    --accent: #1B4A7A;
    --focus: #2A6E9E;
    --mark: #FFE08A;
    --mark-ink: #1A1400;
    --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --serif: 'Noto Serif KR', 'Nanum Myeongjo', 'Batang', 'AppleMyungjo', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0B1826;
      --surface: #112337;
      --ink: #E8EEF5;
      --muted: #9FB0C3;
      --line: #24394F;
      --accent: #8CBBE8;
      --focus: #8CBBE8;
      --mark: #6B5716;
      --mark-ink: #FFF3C4;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0B1826;
    --surface: #112337;
    --ink: #E8EEF5;
    --muted: #9FB0C3;
    --line: #24394F;
    --accent: #8CBBE8;
    --focus: #8CBBE8;
    --mark: #6B5716;
    --mark-ink: #FFF3C4;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* header */
  header { padding: 40px 0 24px; }
  h1 {
    margin: 0 0 12px;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.7rem, 4.5vw, 2.6rem);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .lead { margin: 0 0 16px; color: var(--muted); max-width: 46ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin: 0; font-size: .875rem; color: var(--muted); }
  .meta div { display: flex; gap: 8px; }
  .meta dt { font-weight: 700; color: var(--ink); }
  .meta dd { margin: 0; }

  /* card-news strip */
  .strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 0 0 28px;
    padding: 0;
    list-style: none;
  }
  .strip figure { margin: 0; }
  .strip img { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; border-radius: 4px; }
  @media (max-width: 640px) { .strip { grid-template-columns: repeat(2, 1fr); } }

  /* toolbar */
  .toolbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
  }
  .toolbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .field { position: relative; flex: 1 1 280px; }
  .field svg.icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .field input {
    width: 100%;
    height: 48px;
    padding: 0 44px 0 42px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 6px;
  }
  .field input::placeholder { color: var(--muted); opacity: .85; }
  .field input:focus-visible { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
  .field input::-webkit-search-cancel-button { display: none; }
  .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; padding: 0;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 6px; color: var(--muted); cursor: pointer;
  }
  .clear[hidden] { display: none; }
  .clear:hover { color: var(--ink); }
  .count { margin: 0; font-size: .95rem; color: var(--muted); white-space: nowrap; }
  .count strong { color: var(--ink); font-size: 1.1rem; }

  /* cards */
  main { padding: 24px 0 56px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
    align-items: start;
    margin: 0; padding: 0; list-style: none;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 20px 12px;
  }
  .no { margin: 0 0 2px; font-family: var(--serif); font-weight: 700; font-size: 1.5rem; line-height: 1.2; color: var(--accent); }
  .ttl { margin: 0 0 10px; font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
  .sum { margin: 0; font-size: .95rem; line-height: 1.75; color: var(--muted); }
  .full {
    margin: 0;
    white-space: pre-line;
    font-size: .95rem;
    line-height: 1.8;
    color: var(--ink);
  }
  .full[hidden], .sum[hidden] { display: none; }
  .toggle {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 10px -8px 0; padding: 6px 8px;
    font: inherit; font-size: .875rem; font-weight: 500;
    color: var(--accent); background: none; border: 0; border-radius: 4px; cursor: pointer;
  }
  .toggle:hover { text-decoration: underline; text-underline-offset: 3px; }
  .toggle svg { transition: transform .18s ease; }
  .toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

  /* empty state */
  .empty { padding: 48px 0; text-align: center; color: var(--muted); }
  .empty[hidden] { display: none; }
  .empty p { margin: 0 0 12px; }
  .empty button {
    font: inherit; font-weight: 500; color: var(--accent);
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px;
    padding: 8px 16px; cursor: pointer;
  }

  footer { padding: 0 0 32px; font-size: .8125rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .toggle svg { transition: none; } }
</style>
</head>

<script>
(function () {
  var SUMMARY_LEN = 68;
  var articles = [];
  try {
    articles = JSON.parse(document.getElementById('article-data').textContent);
  } catch (e) {
    console.error('조항 데이터를 읽지 못했어요.', e);
  }

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var input = document.getElementById('q');
  var clearBtn = document.getElementById('clear');
  var expanded = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function parseTerms(q) {
    return q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    var re = new RegExp('(' + terms.map(escRe).join('|') + ')', 'gi');
    return text.split(re).map(function (part, i) {
      return i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part);
    }).join('');
  }

  function matches(a, terms) {
    if (!terms.length) return true;
    var hay = (a['제목'] + ' ' + a['본문']).toLowerCase();
    return terms.every(function (t) { return hay.indexOf(t) !== -1; });
  }

  // 본문 요약: 기본은 앞부분, 검색어가 뒤쪽 본문에 있으면 그 주변을 보여준다.
  function summarize(body, terms) {
    var flat = body.replace(/\s*\n\s*/g, ' ').trim();
    if (flat.length <= SUMMARY_LEN) return { text: flat, short: true };
    var lower = flat.toLowerCase();
    var hit = -1;
    for (var i = 0; i < terms.length; i++) {
      var p = lower.indexOf(terms[i]);
      if (p !== -1 && (hit === -1 || p < hit)) hit = p;
    }
    if (hit > SUMMARY_LEN - 12) {
      var start = Math.max(0, hit - 20);
      return { text: '…' + flat.slice(start, start + SUMMARY_LEN) + '…', short: false };
    }
    return { text: flat.slice(0, SUMMARY_LEN) + '…', short: false };
  }

  function render() {
    var terms = parseTerms(input.value);
    var list = articles.filter(function (a) { return matches(a, terms); });

    grid.innerHTML = list.map(function (a) {
      var id = a['조'];
      var s = summarize(a['본문'], terms);
      var open = !!expanded[id];
      var domId = 'full-' + articles.indexOf(a);
      var toggle = s.short ? '' :
        '<button type="button" class="toggle" data-id="' + esc(id) + '" aria-expanded="' + open + '" aria-controls="' + domId + '">' +
        '<span>' + (open ? '접기' : '전문 보기') + '</span>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>';
      return '<li class="card">' +
        '<p class="no">' + highlight(id, []) + '</p>' +
        '<h2 class="ttl">' + highlight(a['제목'], terms) + '</h2>' +
        '<p class="sum"' + (open ? ' hidden' : '') + '>' + highlight(s.text, terms) + '</p>' +
        (s.short ? '' : '<p class="full" id="' + domId + '"' + (open ? '' : ' hidden') + '>' + highlight(a['본문'], terms) + '</p>') +
        toggle +
        '</li>';
    }).join('');

    count.innerHTML = '결과 <strong>' + list.length + '</strong>건';
    empty.hidden = list.length !== 0;
    clearBtn.hidden = !input.value;
  }

  grid.addEventListener('click', function (e) {
    var btn = e.target.closest('.toggle');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var open = btn.getAttribute('aria-expanded') !== 'true';
    expanded[id] = open;
    var card = btn.closest('.card');
    btn.setAttribute('aria-expanded', open);
    btn.querySelector('span').textContent = open ? '접기' : '전문 보기';
    card.querySelector('.sum').hidden = open;
    card.querySelector('.full').hidden = !open;
  });

  function reset() { input.value = ''; render(); input.focus(); }
  input.addEventListener('input', render);
  input.addEventListener('keydown', function (e) { if (e.key === 'Escape' && input.value) { e.preventDefault(); reset(); } });
  clearBtn.addEventListener('click', reset);
  document.getElementById('reset').addEventListener('click', reset);

  render();
})();
</script>
